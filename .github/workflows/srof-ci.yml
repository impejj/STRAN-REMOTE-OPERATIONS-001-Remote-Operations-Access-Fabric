name: SROF CI
# EXECUTION_POLICY: Self-hosted local-first CI; PR or explicit manual dispatch only, no merge-push duplicate.

on:
  pull_request:
    paths:
      - "gateway/**"
      - "clients/**"
      - "docs/**"
      - "deploy/**"
      - "registry/**"
      - "tests/**"
      - ".github/workflows/srof-ci.yml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: srof-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Python environment
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Policy tests
        run: .venv/bin/pytest -q
      - name: Compile gateway
        run: .venv/bin/python -m compileall src
      - name: OpenAI SROF client unit tests
        working-directory: clients/openai-responses
        run: python3 -m unittest discover -s tests -v
      - name: Compile OpenAI SROF client
        working-directory: clients/openai-responses
        run: python3 -m py_compile srof_openai_client.py
      - name: Validate remote-ops shell syntax
        shell: bash
        run: |
          bash -n ../deploy/remote-ops/*.sh
