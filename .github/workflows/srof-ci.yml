name: SROF CI
# EXECUTION_POLICY: Local-first runtime proof plus host-independent static validation.

on:
  pull_request:
    paths:
      - "gateway/**"
      - "relay/**"
      - "clients/**"
      - "docs/**"
      - "deploy/**"
      - "registry/**"
      - "tests/**"
      - ".github/workflows/srof-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srof-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-local:
    name: Gateway local runtime validation
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Python environment
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Policy tests
        run: .venv/bin/pytest -q
      - name: Compile gateway
        run: .venv/bin/python -m compileall src
      - name: Validate remote-ops shell syntax
        shell: bash
        run: bash -n ../deploy/remote-ops/*.sh

  gateway-static:
    name: Gateway host-independent validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Python environment
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Policy tests
        run: .venv/bin/pytest -q
      - name: Compile gateway
        run: .venv/bin/python -m compileall src
      - name: Validate remote-ops shell syntax
        shell: bash
        run: bash -n ../deploy/remote-ops/*.sh

  relay-static:
    name: Relay static policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Relay unit tests
        run: python3 -m unittest discover -s relay/poc -p 'test_*.py' -v
      - name: Compile Relay
        run: python3 -m py_compile relay/poc/relay.py

  client-static:
    name: OpenAI SROF client static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: clients/openai-responses
        run: python3 -m unittest discover -s tests -v
      - name: Compile
        working-directory: clients/openai-responses
        run: python3 -m py_compile srof_openai_client.py
      - name: Validate Keycloak client bootstrap syntax
        shell: bash
        run: bash -n deploy/native-auth/configure-openai-responses-client.sh
      - name: Verify no remote transport
        shell: bash
        run: |
          ! grep -R -E 'ssh |scp |rsync |desktop.commander|GitHub Actions transport' clients/openai-responses/*.py
          echo "STATIC_ONLY_NO_REMOTE_TRANSPORT=PASS"
