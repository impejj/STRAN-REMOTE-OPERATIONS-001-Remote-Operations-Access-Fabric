name: SROF CI

on:
  pull_request:
    paths:
      - "gateway/**"
      - "docs/**"
      - "deploy/**"
      - "registry/**"
      - "tests/**"
      - ".github/workflows/srof-ci.yml"
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "docs/**"
      - "deploy/**"
      - "registry/**"
      - "tests/**"
      - ".github/workflows/srof-ci.yml"

permissions:
  contents: read

concurrency:
  group: srof-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Python environment
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Policy tests
        run: .venv/bin/pytest -q
      - name: Compile gateway
        run: .venv/bin/python -m compileall src
