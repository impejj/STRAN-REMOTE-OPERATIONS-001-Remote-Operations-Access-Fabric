name: SROF ThinkPad Read-Only Preflight One-Shot
# TEMPORARY_BOOTSTRAP_BRIDGE: self-hosted only, read-only, auto trigger removed after evidence capture.

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: srof-thinkpad-readonly-preflight-one-shot
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Verify SERVER runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "SERVER_HOST=$(hostname -s)"
          echo "SERVER_USER=$(id -un)"
          test "$(hostname -s)" = "profesys-scientiam"

      - name: Run bounded read-only ThinkPad preflight over dedicated SROF SSH
        shell: bash
        run: |
          set -euo pipefail
          KEY=/home/profesys/.ssh/stran_remoteops_server_to_thinkpad
          test -f "$KEY"
          ssh -i "$KEY"             -o BatchMode=yes             -o PasswordAuthentication=no             -o ConnectTimeout=5             -o StrictHostKeyChecking=yes             scientiam-remoteops@192.168.1.6 'bash -s' <<'REMOTE'
          set +e
          echo "========================================"
          echo " THINKPAD · SROF READ-ONLY PREFLIGHT"
          echo "========================================"
          echo "HOST=$(hostname -s)"
          echo "USER=$(id -un)"
          echo "TIME=$(date -Is)"
          echo "SSH_ACTIVE=$(systemctl is-active ssh 2>/dev/null)"
          echo "IPV4:"
          ip -4 -br addr
          echo
          echo "=== WORKSPACE ACCESS ==="
          if [ -d /home/impejj/work/profesys ]; then
            echo "WORKSPACE_PRESENT=YES"
            if [ -r /home/impejj/work/profesys ]; then
              echo "WORKSPACE_READABLE=YES"
              find /home/impejj/work/profesys -mindepth 1 -maxdepth 1 -printf '%f\t%y\n' 2>&1 | sort
            else
              echo "WORKSPACE_READABLE=NO"
              ls -ld /home/impejj /home/impejj/work /home/impejj/work/profesys 2>&1
            fi
          else
            echo "WORKSPACE_PRESENT=NO"
          fi
          echo
          echo "=== SCIENTIAM WORKTREES ==="
          git -C /home/impejj/work/profesys/scientiam worktree list --porcelain 2>&1
          echo
          echo "=== SUSPECT ROOTS ==="
          for d in /home/impejj/work/profesys/scientiam-wt-* /home/impejj/work/profesys/scientiam-context-compiler-validate-*; do
            [ -e "$d" ] || continue
            echo "----- $d -----"
            if git -C "$d" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git -C "$d" status --short --branch 2>&1
              printf 'HEAD='
              git -C "$d" rev-parse --short HEAD 2>&1
              printf 'TOPLEVEL='
              git -C "$d" rev-parse --show-toplevel 2>&1
            else
              echo "NOT_A_GIT_WORKTREE_OR_NOT_READABLE"
            fi
          done
          echo
          echo "READ_ONLY_PREFLIGHT_COMPLETE=YES"
          REMOTE
