[project]
name = "scientiam-remote-ops-gateway"
version = "0.1.0"
description = "Governed MCP/OpenSSH remote operations gateway for SCIENTIAM"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.30,<2",
  "pydantic>=2.7,<3",
  "PyJWT[crypto]>=2.9,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "jsonschema>=4.23,<5"
]
gap-bridge = [
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.35,<3"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
