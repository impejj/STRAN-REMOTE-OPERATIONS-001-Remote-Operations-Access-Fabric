services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:latest
    restart: unless-stopped
    environment:
      DYNAMIC_CONFIG: "false"
      HOSTNAME: "${MESH_HOSTNAME}"
      PORT: "443"
      REDIR_PORT: "80"
      ALLOW_NEW_ACCOUNTS: "false"
      USE_MONGODB: "false"
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-web:/opt/meshcentral/meshcentral-web
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
    ports:
      - "${MESH_BIND_IP:-127.0.0.1}:8443:443"
      - "${MESH_BIND_IP:-127.0.0.1}:8088:80"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get({host:'127.0.0.1',port:443,rejectUnauthorized:false},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  meshcentral-data:
  meshcentral-files:
  meshcentral-web:
  meshcentral-backups:
